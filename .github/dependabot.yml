# Dependabot-konfigurasjon.
#
# Minor- og patch-oppdateringer samles i grupperte PR-er slik at et repo
# gir en h�ndfull PR-er i uka, ikke en per pakke.
#
# Major-oppdateringer kommer normalt som en PR per pakke og krever manuell
# testing. React, React DOM og typene deres er et unntak: de m� oppdateres
# sammen for � unng� inkompatible peer-avhengigheter. Gruppen er fortsatt
# underlagt CI og regelen om manuell testing av major-hopp.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 5
    groups:
      sikkerhetsoppdateringer:
        applies-to: security-updates
        patterns: ["*"]
      react:
        applies-to: version-updates
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      utviklingsavhengigheter:
        applies-to: version-updates
        dependency-type: development
        update-types: ["minor", "patch"]
      produksjonsavhengigheter:
        applies-to: version-updates
        dependency-type: production
        update-types: ["minor", "patch"]

  # Holder GitHub Actions (checkout, setup-node osv.) oppdatert.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Oslo
    groups:
      actions:
        update-types: ["minor", "patch"]
